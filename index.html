<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 My Tasks</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div>
        <h1 class="header-title">📝 My Tasks</h1>
        <span class="header-count" id="pendingCount">0 left</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="เปลี่ยนธีม">
        <!-- Moon icon (show in light mode) -->
        <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <!-- Sun icon (show in dark mode) -->
        <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </header>

    <!-- Task List -->
    <main class="task-list" id="taskList" role="list" aria-label="รายการงาน">
      <!-- Tasks will be rendered here -->
    </main>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <p>ยังไม่มีงาน</p>
      <p class="empty-state-hint">เพิ่มงานด้านล่างเลย!</p>
    </div>

    <!-- Add Task Input -->
    <div class="add-task-container">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="taskInput" 
          class="add-task-input" 
          placeholder="เพิ่มงานใหม่..." 
          maxlength="200"
          aria-label="ชื่องานใหม่"
          autocomplete="off"
        >
        <button class="add-btn" id="addBtn" aria-label="เพิ่มงาน">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <p class="input-error" id="inputError" aria-live="polite"></p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
